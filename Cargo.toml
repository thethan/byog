[package]
name = "byog"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["cards", "decks", "engine", "token-pools"]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cards = { path = "cards", version = "0.1.0" }
decks = { path = "decks", version = "0.1.0" }
engine = { path = "engine", version = "0.1.0" }
token-pools = { path = "token-pools", version = "0.1.0" }
csv = "1.3"
prost = "0.13"
rand = "0.10.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
