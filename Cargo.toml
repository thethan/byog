[package]
name = "byog"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
csv = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.10.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
