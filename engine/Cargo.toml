[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[dependencies]
cards = { path = "../cards", version = "0.1.0" }
csv = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.10.2"
token-pools = { path = "../token-pools", version = "0.1.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
js-sys = "0.3"
