<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BYOG Zones</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto max-w-7xl p-4 md:p-6">
      <header class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <h1 class="text-2xl font-bold">BYOG Web App</h1>
        <div class="flex flex-wrap gap-2">
          <button id="draw-btn" class="rounded bg-indigo-600 px-3 py-2 text-sm font-semibold hover:bg-indigo-500">Draw</button>
          <button id="auto-play-btn" class="rounded bg-emerald-600 px-3 py-2 text-sm font-semibold hover:bg-emerald-500">Auto Play First Hand Card</button>
          <button id="discard-btn" class="rounded bg-rose-600 px-3 py-2 text-sm font-semibold hover:bg-rose-500">Discard First Hand Card</button>
          <button id="energy-btn" class="rounded bg-amber-600 px-3 py-2 text-sm font-semibold hover:bg-amber-500">+1 Hand Energy</button>
        </div>
      </header>

      <p id="status" class="mb-4 rounded border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-300">Loading...</p>

      <section id="zones" class="grid grid-cols-1 gap-3 md:grid-cols-2 xl:grid-cols-4"></section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
